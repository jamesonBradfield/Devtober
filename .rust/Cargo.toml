[package]
name = "rust_gdextension"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# 1. Add dep:tracy-client to the profiling feature
profiling = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-tracy", "dep:tracy-client"]

[dependencies]
godot = "0.3.1"
nalgebra = "0.34.1"
rand = "0.9.2"
rayon = "1.10"

# Make tracing dependencies optional
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-tracy = { version = "0.11", optional = true }

# 2. CRITICAL FIX: Explicitly require tracy-client and force the manual-lifetime feature!
tracy-client = { version = "0.18", features = ["manual-lifetime"], optional = true }

[profile.release]
debug = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vector_ops"
harness = false
path = "src/benchmark.rs"
